<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1.4材质图转1.3 - tModWebTools</title>
  <link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" />
  <noscript><link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" /></noscript>
  <link rel="stylesheet" href="/trtools/css/trtools.css" />
  <link rel="stylesheet" href="/trtools/css/trthemes.css" />
  <link rel="icon" type="image/svg+xml" href="/trtools/img/cache-logo.svg" />
  <style>
    .t14Layout {
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 12px;
      margin-top: 0;
      align-items: start;
    }
    .t14LeftCol {
      display: grid;
      gap: 12px;
    }
    .t14OutputHost {
      max-height: calc(100vh - 220px);
      min-height: 520px;
      overflow: auto;
    }
    @media (max-width: 960px) {
      .t14Layout { grid-template-columns: 1fr; }
      .t14OutputHost { max-height: 520px; min-height: 360px; }
    }
  </style>
</head>
<body class="appBody" data-twt-active="tool14to13">
  <div class="bgFx" aria-hidden="true"></div>
  <div class="appShell" id="appShell">
        <aside class="appSidebar" id="appSidebar">
      <div id="appSidebarInnerMount"></div>
    </aside>
<main class="appMain">
      <div class="appMainInner">
        <div class="appTopBar card panel">
          <button type="button" class="sidebarToggle" id="sidebarToggle" aria-label="收起侧边栏" aria-expanded="true" aria-controls="appSidebar">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div class="appTopBarMain">
            <h1 class="appPageTitle" style="display:flex;align-items:center;gap:10px">
              <img src="/trtools/img/14to13icon.png" alt="" style="height:22px;width:auto;max-width:44px;object-fit:contain;image-rendering:pixelated" />
              <span>1.4材质图转1.3</span>
            </h1>
            <div class="hint" style="margin-top:8px">输入需为 360×224 或同比例缩放。</div>
          </div>
          <div class="appTopBarEnd">
            <div class="onlineBlock">
              <div class="online" data-i18n-title="online.tooltipArmor">
                <span data-i18n="online.prefix">当前在线</span> <span id="onlineCount">-</span> <span data-i18n="online.suffix">人</span>
              </div>
            </div>
          </div>
        </div>

        <div class="t14Layout">
          <div class="t14LeftCol">
            <section class="card panel">
              <div class="sectionTitle">输入材质图</div>
              <div class="drop twtSampleHost">
                <div class="twtSample" style="--twt-sample:url(/trtools/img/template-samples/sample-body14-template.png);--twt-sample-ratio:480/356" data-label="示例" data-i18n-title="common.sampleTip" title="需要上传的模板示例（悬停放大）"></div>
                <div style="font-weight:800">请选择一张材质图</div>
                <div class="hint">支持 PNG/BMP。尺寸需为 360×224 或同比例。</div>
                <input id="srcFile" class="hiddenFileInput" type="file" accept="image/png,image/bmp" />
                <div class="row">
                  <button id="pickFile" class="btn" type="button"><i class="fas fa-image" style="margin-right:8px"></i>选择图片</button>
                  <button id="clearFile" class="btn secondary" type="button"><i class="fas fa-trash" style="margin-right:8px"></i>清空</button>
                </div>
                <span id="fileText" class="fileText">未选择文件</span>
              </div>

              <div class="sectionTitle" style="margin-top:14px">输出类型</div>
              <div class="checkList">
                <label style="display:flex;align-items:center;gap:8px"><input id="modeArmor" type="radio" name="outMode" checked />盔甲图</label>
                <label style="display:flex;align-items:center;gap:8px"><input id="modeArms" type="radio" name="outMode" />手臂图</label>
              </div>

              <div class="sectionTitle" style="margin-top:14px">导出选项</div>
              <div class="checkList">
                <label style="display:flex;align-items:center;gap:8px">
                  <input id="useFemaleBody" type="checkbox" />
                  <span>女性身体</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px">
                  <input id="useShoulder" type="checkbox" />
                  <span>肩甲</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px">
                  <input id="shiftUp2px" type="checkbox" checked />
                  <span>指定帧上移 2px</span>
                </label>
                <label style="display:flex;align-items:center;gap:8px">
                  <input id="addIndex" type="checkbox" />
                  <span>添加序列标号</span>
                </label>
              </div>

              <div class="toolbar">
                <button id="runBuild" class="btn" type="button"><i class="fas fa-cogs" style="margin-right:8px"></i>生成</button>
                <button id="downloadOut" class="btn secondary" type="button" disabled><i class="fas fa-download" style="margin-right:8px"></i>下载 PNG</button>
              </div>

              <div id="status" class="status"></div>
            </section>

            <section class="card panel">
              <div class="sectionTitle">输入预览（归一化后）</div>
              <div class="materialPreviewFrame previewFrame">
                <canvas id="inputPreview" width="360" height="224"></canvas>
              </div>
            </section>
          </div>

          <section class="card panel">
            <div class="sectionTitle">输出预览（40×1120）</div>
            <label class="small inline">
              <input type="checkbox" id="previewGrid" />
              <span>显示像素网格（预览）</span>
            </label>
            <div id="outputPreviewHost" class="materialPreviewFrame previewFrame t14OutputHost">
              <canvas id="outputPreview" width="40" height="1120"></canvas>
            </div>
          </section>
        </div>

        <div class="footer">
          <div data-i18n="footer.credit">tModLoader ArknightsMod - Mornia-Cherry</div>
          <div>
            <span style="margin-right:10px;" data-i18n="footer.contact">联系我</span>
            <a href="https://steamcommunity.com/id/1594962681/" target="_blank" rel="noopener noreferrer">Steam</a>
            <span style="margin:0 8px;opacity:.65;">|</span>
            <a href="https://space.bilibili.com/356597012" target="_blank" rel="noopener noreferrer" data-i18n="footer.bilibili">哔哩哔哩</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script defer src="/trtools/js/i18n-es.js"></script>
  <script defer src="/trtools/js/i18n.js"></script>
  <script defer src="/trtools/js/sidebar-shared.js"></script>

  <script defer src="/trtools/js/hot-switch.js"></script>
  <script defer src="/trtools/js/app-shell.js"></script>
  <script defer src="/trtools/js/online_client.js"></script>
  <script defer src="/trtools/js/visit-track.js"></script>
  <script defer src="/trtools/js/tool14to13.js"></script>
</body>
</html>
