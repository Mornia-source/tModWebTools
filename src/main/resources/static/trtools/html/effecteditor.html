<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-doc="meta.titleEffectEditor">特效编辑生成器 1.4.4 — tModWebTools</title>
  <script>
    (function () {
      try {
        var lang = localStorage.getItem("trtools.lang") || "zh-CN";
        var theme = localStorage.getItem("trtools.theme") || "emerald";
        var lt = lang === "en" ? "en" : lang === "es" ? "es" : "zh";
        var TBOOT = {
          "meta.titleEffectEditor": { zh: "特效编辑生成器 1.4.4 — tModWebTools", en: "Effect Editor & Generator 1.4.4 — tModWebTools", es: "Editor y generador de efectos 1.4.4 — tModWebTools" }
        };
        var _tt = document.querySelector("title[data-i18n-doc]");
        var _key = _tt && _tt.getAttribute("data-i18n-doc");
        if (_key && TBOOT[_key]) document.title = TBOOT[_key][lt];
        document.documentElement.setAttribute("lang", lang === "zh-CN" ? "zh-CN" : lang === "es" ? "es" : "en");
        document.documentElement.setAttribute("data-trtheme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/trtools/css/trtools.css" as="style" />
  <link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" />
  <noscript><link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" /></noscript>
  <link rel="stylesheet" href="/trtools/css/trtools.css" />
  <link rel="stylesheet" href="/trtools/css/trthemes.css" />
  <link rel="icon" type="image/svg+xml" href="/trtools/img/cache-logo.svg" />
  <style>
    /* tFX 文字图标（与 tEffectEditor 左上角 logo 同款样式） */
    .tfxLogo {
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; letter-spacing: 1px; color: var(--accent, #2d8ceb);
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .appPageIcon.tfxLogo { font-size: 18px; width: auto; height: 18px; }
    /* 编辑器嵌入区：占满剩余高度 */
    .effectEditorFrameWrap {
      margin-top: 0; padding: 0; overflow: hidden;
      height: calc(100vh - 150px); min-height: 560px;
      border-radius: 12px;
    }
    .effectEditorFrame { width: 100%; height: 100%; border: 0; display: block; background: #1d1d1d; }
    .effectEditorOpenRow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body class="appBody" data-twt-active="effecteditor">
  <div class="bgFx" aria-hidden="true"></div>
  <div class="appShell" id="appShell">
    <aside class="appSidebar" id="appSidebar">
      <div id="appSidebarInnerMount"></div>
    </aside>
    <main class="appMain">
      <div class="appMainInner">
        <div class="appTopBar card panel">
          <button type="button" class="sidebarToggle" id="sidebarToggle" aria-label="收起侧边栏" aria-expanded="true" aria-controls="appSidebar">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div class="appTopBarMain">
            <h1 class="appPageTitle"><span class="appPageIcon tfxLogo" aria-hidden="true">tFX</span><span data-i18n="effectEditor.h1">特效编辑生成器 1.4.4</span></h1>
          </div>
          <div class="appTopBarEnd">
            <div class="effectEditorOpenRow">
              <a class="btn secondary" style="text-decoration:none" href="/effecteditor-app/index.html" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-external-link-alt" style="margin-right:6px"></i><span data-i18n="effectEditor.openNew">新标签页打开</span>
              </a>
            </div>
          </div>
        </div>

        <section class="card panel effectEditorFrameWrap">
          <iframe id="effectEditorFrame" class="effectEditorFrame" src="/effecteditor-app/index.html"
                  title="tEffectEditor" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
        </section>
      </div>
    </main>
  </div>

  <button class="toTop" id="toTop" type="button" data-i18n-title="toTop" data-i18n-aria="toTop" title="回到顶部" aria-label="回到顶部">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script defer src="/trtools/js/i18n-es.js"></script>
  <script defer src="/trtools/js/i18n.js"></script>
  <script defer src="/trtools/js/sidebar-shared.js"></script>
  <script defer src="/trtools/js/hot-switch.js"></script>
  <script defer src="/trtools/js/app-shell.js"></script>
  <script defer src="/trtools/js/online_client.js"></script>
  <script defer src="/trtools/js/visit-track.js"></script>
</body>
</html>
