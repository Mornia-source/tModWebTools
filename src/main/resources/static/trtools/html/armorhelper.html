<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-doc="meta.titleArmor">装备帧生成器 — tModWebTools</title>
  <script>
    (function () {
      try {
        var lang = localStorage.getItem("trtools.lang") || "zh-CN";
        var theme = localStorage.getItem("trtools.theme") || "emerald";
        var lt = lang === "en" ? "en" : lang === "es" ? "es" : "zh";
        var TBOOT = {
          "meta.titleHome": { zh: "tModWebTools - 尊重每一位开发者的意愿 - Mornia-Cherry", en: "tModWebTools — Respecting every developer's wishes — Mornia-Cherry", es: "tModWebTools — Respetando los deseos de cada desarrollador — Mornia-Cherry" },
          "meta.titleArmor": { zh: "装备帧生成器 — tModWebTools", en: "ArmorHelper — tModWebTools", es: "ArmorHelper — tModWebTools" },
          "meta.titleOgg": { zh: "OGG 转换 — tModWebTools", en: "OGG convert — tModWebTools", es: "Conversión OGG — tModWebTools" },
          "meta.titleStats": { zh: "访问统计 — tModWebTools", en: "Visit stats — tModWebTools", es: "Estadísticas de visitas — tModWebTools" },
          "meta.titleSettings": { zh: "设置 — tModWebTools", en: "Settings — tModWebTools", es: "Ajustes — tModWebTools" },
          "meta.titleTmodUnpacker": { zh: "tModUnpacker — tModWebTools", en: "tModUnpacker — tModWebTools", es: "tModUnpacker — tModWebTools" },
          "meta.titleSprite": { zh: "躯干格式转换 — tModWebTools", en: "Body sprite transform — tModWebTools", es: "Transformación de sprite corporal — tModWebTools" },
          "meta.titleTexture": { zh: "物块生成器 — tModWebTools", en: "TextureSplitter — tModWebTools", es: "TextureSplitter — tModWebTools" }
        };
        var _tt = document.querySelector("title[data-i18n-doc]");
        var _key = _tt && _tt.getAttribute("data-i18n-doc");
        if (_key && TBOOT[_key]) document.title = TBOOT[_key][lt];
        document.documentElement.setAttribute("lang", lang === "zh-CN" ? "zh-CN" : lang === "es" ? "es" : "en");
        document.documentElement.setAttribute("data-trtheme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/trtools/css/trtools.css?v=24" as="style" />
  <link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" />
  <noscript><link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" /></noscript>
  <link rel="stylesheet" href="/trtools/css/trtools.css?v=24" />
  <link rel="stylesheet" href="/trtools/css/trthemes.css?v=1" />
  <link rel="icon" type="image/svg+xml" href="/trtools/img/cache-logo.svg" />
</head>
<body class="appBody" data-twt-active="armorhelper">
  <div class="bgFx" aria-hidden="true"></div>
  <div class="appShell" id="appShell">
        <aside class="appSidebar" id="appSidebar">
      <div id="appSidebarInnerMount"></div>
    </aside>
<main class="appMain">
      <div class="appMainInner">
        <div class="appTopBar card panel">
          <button type="button" class="sidebarToggle" id="sidebarToggle" aria-label="收起侧边栏" aria-expanded="true" aria-controls="appSidebar">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div class="appTopBarMain">
            <h1 class="appPageTitle"><img class="appPageIcon" src="/trtools/img/ArmorHelper.png" alt="" width="18" height="18" decoding="async" fetchpriority="low" /><span data-i18n="armor.h1">ArmorHelper v1.0</span></h1>
            <div class="hint" style="margin-top:8px" data-i18n="armor.intro">输入模板必须是 128×80。输出为 20×560 后再 2x 放大到 40×1120。</div>
          </div>
          <div class="appTopBarEnd">
            <div class="onlineBlock">
              <div class="online" data-i18n-title="online.tooltipArmor">
                <span data-i18n="online.prefix">当前在线</span> <span id="onlineCount">-</span> <span data-i18n="online.suffix">人</span>
              </div>
            </div>
          </div>
        </div>

        <div class="armorGrid" style="margin-top:0">
          <section class="card panel">
            <div class="sectionTitle" data-i18n="armor.inTitle">输入模板</div>
            <div class="filePicker">
              <div class="drop" id="armorDrop">
                <div style="font-weight:800" data-i18n="armor.dropMain">拖拽图片到这里</div>
                <div class="hint" data-i18n="armor.dropHint">或点击选择。支持多文件批量导出</div>
                <input id="armorFiles" class="hiddenFileInput" type="file" accept="image/png,image/bmp" multiple />
                <div class="row">
                  <button id="pickArmorFiles" class="btn" type="button"><i class="fas fa-images" style="margin-right:8px"></i><span data-i18n="armor.pick">选择图片</span></button>
                  <button id="clearArmorFiles" class="btn secondary" type="button"><i class="fas fa-trash" style="margin-right:8px"></i><span data-i18n="armor.clear">清空</span></button>
                </div>
                <span id="armorFileText" class="fileText" data-i18n="armor.none">未选择文件</span>
              </div>
            </div>

            <div class="sectionTitle" data-i18n="armor.exportOpts">导出选项</div>
            <div class="checkList armorExportModes" id="modeList"></div>

            <div class="inline" style="margin-top:12px">
              <label style="margin:0;display:flex;align-items:center;gap:8px">
                <input id="zipMode" type="checkbox" />
                <i class="fas fa-file-archive" aria-hidden="true"></i>
                <span data-i18n="armor.zipDl">打包 ZIP 下载</span>
              </label>
            </div>

            <div class="toolbar">
              <button id="runArmor" class="btn"><i class="fas fa-cogs" style="margin-right:8px"></i><span data-i18n="armor.export">导出</span></button>
              <button id="previewOnly" class="btn secondary" disabled><span data-i18n="armor.previewBtn">预览</span></button>
            </div>

            <div id="armorStatus" class="status"></div>
          </section>

          <section class="card panel">
            <div class="sectionTitle" data-i18n="armor.previewTitle">预览</div>

            <div class="previewStack">
              <div class="previewBox previewBox--material">
                <h3 data-i18n="armor.inTpl">输入模板</h3>
                <div class="materialPreviewFrame previewFrame previewFrame--empty" id="inputPreviewHost">
                  <canvas id="inputPreview" width="128" height="80"></canvas>
                </div>
              </div>

              <div class="materialPreviewSection">
                <div class="sectionTitle" data-i18n="armor.outPrev">输出预览</div>
                <div class="materialPreviewFrame previewFrame previewFrame--empty" id="outputScroller">
                  <canvas id="outputPreview" width="40" height="48"></canvas>
                </div>
              </div>
            </div>
          </section>
        </div>

        <div class="footer armorCreditFooter">
          <p class="armorCredit">
            Thanks to the original tool author, <strong>Mirsario</strong>.
            <a href="https://forums.terraria.org/index.php?threads/armorhelper-sprite-armor-sets-30x-times-faster.68744/" target="_blank" rel="noopener noreferrer">Original release page</a>
          </p>
          <div data-i18n="footer.credit">tModLoader ArknightsMod - Mornia-Cherry</div>
          <div>
            <span style="margin-right:10px;" data-i18n="footer.contact">联系我</span>
            <a href="https://steamcommunity.com/id/1594962681/" target="_blank" rel="noopener noreferrer">Steam</a>
            <span style="margin:0 8px;opacity:.65;">|</span>
            <a href="https://space.bilibili.com/356597012" target="_blank" rel="noopener noreferrer" data-i18n="footer.bilibili">哔哩哔哩</a>
          </div>
          <div class="bugFeedbackRow" lang="zh-CN">
            <span class="bugFeedbackWrap">
              <span class="bugFeedbackText" tabindex="0" role="note" data-i18n="footer.bug">BUG反馈</span>
              <span class="bugFeedbackShot" aria-hidden="true">
                <img class="bugFeedbackImg" src="/trtools/img/bug-feedback-snipaste.jpg" alt="" loading="lazy" decoding="async" />
              </span>
            </span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script defer src="/trtools/js/jszip-local/jszip.min.js"></script>
  <script defer src="/trtools/js/gif-local/gif.js"></script>
  <script defer src="/trtools/js/i18n-es.js?v=9"></script>
  <script defer src="/trtools/js/i18n.js?v=12"></script>
  <script defer src="/trtools/js/sidebar-shared.js?v=10"></script>

  <script defer src="/trtools/js/hot-switch.js?v=7"></script>
  <script defer src="/trtools/js/app-shell.js?v=11"></script>
  <script defer src="/trtools/js/online_client.js?v=2"></script>
  <script defer src="/trtools/js/visit-track.js?v=1"></script>
  <script defer src="/trtools/js/armorhelper.js?v=1"></script>
</body>
</html>
