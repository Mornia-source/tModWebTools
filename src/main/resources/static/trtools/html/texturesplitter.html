<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-doc="meta.titleTexture">物块生成器 — tModWebTools</title>
  <script>
    (function () {
      try {
        var lang = localStorage.getItem("trtools.lang") || "zh-CN";
        var theme = localStorage.getItem("trtools.theme");
        if (localStorage.getItem("trtools.themeChosen") !== "1" && (!theme || theme === "emerald")) theme = "national";
        theme = "national"; // FORCE_THEME：国庆期间强制，节后删除此行
        var lt = lang === "en" ? "en" : lang === "es" ? "es" : "zh";
        var TBOOT = {
          "meta.titleHome": { zh: "tModWebTools - 尊重每一位开发者的意愿 - Mornia-Cherry", en: "tModWebTools — Respecting every developer's wishes — Mornia-Cherry", es: "tModWebTools — Respetando los deseos de cada desarrollador — Mornia-Cherry" },
          "meta.titleArmor": { zh: "装备帧生成器 — tModWebTools", en: "ArmorHelper — tModWebTools", es: "ArmorHelper — tModWebTools" },
          "meta.titleOgg": { zh: "OGG 转换 — tModWebTools", en: "OGG convert — tModWebTools", es: "Conversión OGG — tModWebTools" },
          "meta.titleStats": { zh: "访问统计 — tModWebTools", en: "Visit stats — tModWebTools", es: "Estadísticas de visitas — tModWebTools" },
          "meta.titleSettings": { zh: "设置 — tModWebTools", en: "Settings — tModWebTools", es: "Ajustes — tModWebTools" },
          "meta.titleTmodUnpacker": { zh: "tModUnpacker — tModWebTools", en: "tModUnpacker — tModWebTools", es: "tModUnpacker — tModWebTools" },
          "meta.titleSprite": { zh: "躯干格式转换 — tModWebTools", en: "Body sprite transform — tModWebTools", es: "Transformación de sprite corporal — tModWebTools" },
          "meta.titleTexture": { zh: "物块生成器 — tModWebTools", en: "TextureSplitter — tModWebTools", es: "TextureSplitter — tModWebTools" }
        };
        var _tt = document.querySelector("title[data-i18n-doc]");
        var _key = _tt && _tt.getAttribute("data-i18n-doc");
        if (_key && TBOOT[_key]) document.title = TBOOT[_key][lt];
        document.documentElement.setAttribute("lang", lang === "zh-CN" ? "zh-CN" : lang === "es" ? "es" : "en");
        document.documentElement.setAttribute("data-trtheme", theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/trtools/css/trtools.css" as="style" />
  <link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" />
  <noscript><link rel="stylesheet" href="/trtools/css/fontawesome-local/css/all.min.css" /></noscript>
  <link rel="stylesheet" href="/trtools/css/trtools.css" />
  <link rel="stylesheet" href="/trtools/css/trthemes.css" />
  <link rel="icon" type="image/svg+xml" href="/trtools/img/cache-logo.svg" />
</head>
<body class="appBody" data-twt-active="texturesplitter">
  <div class="bgFx" aria-hidden="true"></div>
  <div class="appShell" id="appShell">
        <aside class="appSidebar" id="appSidebar">
      <div id="appSidebarInnerMount"></div>
    </aside>
<main class="appMain">
      <div class="appMainInner">
        <div class="appTopBar card panel">
          <button type="button" class="sidebarToggle" id="sidebarToggle" data-i18n-title="sidebar.collapse" data-i18n-aria="sidebar.collapse" title="收起侧边栏" aria-expanded="true" aria-controls="appSidebar" aria-label="收起侧边栏">
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <div class="appTopBarMain">
            <h1 class="appPageTitle" style="display:flex;align-items:center;gap:10px">
              <img src="/trtools/img/TextureSplitter.ico" alt="" width="22" height="22" style="object-fit:contain" />
              <span data-i18n="tex.h1">TextureSplitter v2.6</span>
            </h1>
            <div class="hint" style="margin-top:4px" data-i18n-html="tex.intro"></div>
          </div>
          <div class="appTopBarEnd">
            <div class="onlineBlock">
              <div class="online" data-i18n-title="online.tooltipDefault">
                <span data-i18n="online.prefix">当前在线</span> <span id="onlineCount">-</span> <span data-i18n="online.suffix">人</span>
              </div>
            </div>
          </div>
        </div>

        <div class="armorGrid" style="margin-top:0">
          <section class="card panel tsRichSelectHost" id="tsInputCard">
            <div class="sectionTitle" data-i18n="tex.inPng">输入 PNG</div>
            <div class="filePicker">
              <div class="drop" id="tsDrop">
                <div style="font-weight:800" data-i18n="tex.dropMain">拖拽图片到这里</div>
                <div class="hint" data-i18n-html="tex.dropHint"></div>
                <input id="tsFile" class="hiddenFileInput" type="file" accept=".png,image/png" />
                <div class="row">
                  <button id="tsPick" class="btn" type="button"><i class="fas fa-image" style="margin-right:8px"></i><span data-i18n="tex.pick">选择图片</span></button>
                </div>
              </div>
            </div>

            <p id="tsKindHint" class="small" style="margin-top:10px"></p>

            <div id="tsModeWrap" class="tsModeWrap tsModeWrap--disabled">
              <div class="sectionTitle" data-i18n="tex.modeTitle">物块衔接模式</div>
              <label class="small" for="tsMode" data-i18n="tex.modeOnly74">仅 74×74 物块需要选择（与原版程序输入数字对应）</label>
              <select id="tsMode" class="textInput" style="margin-top:8px;max-width:100%;width:100%;box-sizing:border-box;display:none" disabled aria-disabled="true">
                <option value="0" data-i18n="tex.mode0">不与其他物块衔接（输出 234×90）</option>
                <option value="-1" data-i18n="tex.modeNeg1">自定义衔接样式，不叠加材质（输出 288×270）</option>
                <option value="1" data-i18n="tex.mode1"> — 土块（288×270 + 叠加）</option>
                <option value="2" data-i18n="tex.mode2"> — 石块（288×270 + 叠加）</option>
                <option value="3" data-i18n="tex.mode3"> — 泥块（288×270 + 叠加）</option>
                <option value="4" data-i18n="tex.mode4"> — 雪块（288×270 + 叠加）</option>
                <option value="5" data-i18n="tex.mode5"> — 树叶块（288×270 + 叠加）</option>
                <option value="6" data-i18n="tex.mode6"> — 云（288×270 + 叠加）</option>
                <option value="7" data-i18n="tex.mode7"> — 沙块（288×270 + 叠加）</option>
                <option value="8" data-i18n="tex.mode8"> — 猩红沙块（288×270 + 叠加）</option>
                <option value="9" data-i18n="tex.mode9"> — 黑檀沙块（288×270 + 叠加）</option>
                <option value="10" data-i18n="tex.mode10"> — 珍珠沙块（288×270 + 叠加）</option>
                <option value="11" data-i18n="tex.mode11"> — 灰烬块（288×270 + 叠加）</option>
              </select>
              <div class="tsRichSelect" id="tsModeRich" data-i18n-aria="tex.richAria" aria-label="物块衔接模式（带图标）">
                <button type="button" class="tsRichSelectBtn" id="tsModeRichBtn" disabled aria-disabled="true">
                  <span class="tsRichSelectValue" id="tsModeRichValue">
                    <img class="tsRichSelectIcon" id="tsModeRichIcon" alt="" decoding="async" fetchpriority="low" />
                    <span class="tsRichSelectValueText" id="tsModeRichText">请选择（仅 74×74 可用）</span>
                  </span>
                  <i class="fas fa-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="tsRichSelectMenu" id="tsModeRichMenu" hidden>
                  <ul class="tsRichSelectList" id="tsModeRichList" role="listbox" data-i18n-aria="tex.listAria" aria-label="物块衔接模式选项"></ul>
                </div>
              </div>
            </div>

            <div class="toolbar" style="margin-top:14px">
              <button type="button" class="btn" id="tsRun"><i class="fas fa-magic" style="margin-right:8px"></i><span data-i18n="tex.gen">生成贴图</span></button>
              <button type="button" class="btn secondary" id="tsDownload" disabled><i class="fas fa-download" style="margin-right:8px"></i><span data-i18n="tex.download">下载 PNG</span></button>
            </div>
            <div id="tsStatus" class="status" style="margin-top:10px"></div>
          </section>

          <section class="card panel">
            <div class="tsExampleBlock">
              <div class="sectionTitle" data-i18n="tex.sampleTitle">示例（点击图像可加载示例）</div>
              <div class="tsFormatHintRow" role="group" data-i18n-aria="tex.sampleTitle" aria-label="示例（点击图像可加载示例）">
                <button type="button" class="tsFormatHintPick" id="tsSamplePickTile" data-sample-kind="tile" data-i18n-title="tex.tileTitle" title="点击加载物块示例">
                  <span class="tsFormatHintLabel" data-i18n="tex.tileLabel">物块 74×74</span>
                  <span class="tsFormatHintImgWrap">
                    <img class="tsFormatHintImg" src="/trtools/img/samples/sample-tile-74x74.png" width="74" height="74" alt="" decoding="async" fetchpriority="low" />
                  </span>
                </button>
                <button type="button" class="tsFormatHintPick" id="tsSamplePickWall" data-sample-kind="wall" data-i18n-title="tex.wallTitle" title="点击加载墙壁示例">
                  <span class="tsFormatHintLabel" data-i18n="tex.wallLabel">墙壁 106×106</span>
                  <span class="tsFormatHintImgWrap">
                    <img class="tsFormatHintImg" src="/trtools/img/samples/sample-wall-106x106.png" width="106" height="106" alt="" decoding="async" fetchpriority="low" />
                  </span>
                </button>
              </div>
            </div>
            <div class="sectionTitle tsPreviewSectionTitle" data-i18n="tex.previewTitle">预览</div>
            <div class="materialPreviewFrame previewFrame previewFrame--empty" id="tsPreviewHost">
              <canvas id="tsPreview" width="1" height="1"></canvas>
            </div>
            <p class="hint" style="margin-top:10px" data-i18n-html="tex.outHint"></p>
          </section>
        </div>

        <div class="footer armorCreditFooter">
          <p class="armorCredit tsOriginCredit twt-credit--zh" lang="zh-CN">
            Web 工具逻辑复刻自 <span class="tsWinterLeafWrap"><span class="tsWinterLeaf" tabindex="0" role="note">冬叶</span><span class="tsWinterLeafShot" aria-hidden="true"><img class="tsWinterLeafShotImg" src="/trtools/img/texturesplitter/texturesplitter-winter-leaf-hover.png" alt="" width="360" loading="eager" decoding="async" /></span></span> 的 TextureSplitter 工具（2025-4-29）。
          </p>
          <p class="armorCredit tsOriginCredit twt-credit--en" lang="en" data-i18n="tex.creditEnP1"></p>
          <p class="armorCredit tsOriginCredit twt-credit--zh" lang="zh-CN" style="margin-top:8px">
            欢迎同样对泰拉瑞亚模组开发感兴趣的同道中人入群交流叙谈：
            <span class="tsQrWrap">
              <span class="tsQrText" tabindex="0" role="note">960277607</span>
              <span class="tsQrShot" aria-hidden="true">
                <img class="tsQrShotImg" src="/trtools/img/group-qr.jpg" alt="" width="220" loading="eager" decoding="async" />
              </span>
            </span>
          </p>
          <p class="armorCredit tsOriginCredit twt-credit--en" lang="en" style="margin-top:8px" data-i18n="tex.creditEnP2"></p>
          <div data-i18n="footer.credit" style="margin-top:12px">tModLoader ArknightsMod - Mornia-Cherry</div>
          <div>
            <span style="margin-right:10px;" data-i18n="footer.contact">联系我</span>
            <a href="https://steamcommunity.com/id/1594962681/" target="_blank" rel="noopener noreferrer">Steam</a>
            <span style="margin:0 8px;opacity:.65;">|</span>
            <a href="https://space.bilibili.com/356597012" target="_blank" rel="noopener noreferrer" data-i18n="footer.bilibili">哔哩哔哩</a>
          </div>
          <div class="bugFeedbackRow" lang="zh-CN">
            <span class="bugFeedbackWrap">
              <span class="bugFeedbackText" tabindex="0" role="note" data-i18n="footer.bug">BUG反馈</span>
              <span class="bugFeedbackShot" aria-hidden="true">
                <img class="bugFeedbackImg" src="/trtools/img/bug-feedback-snipaste.jpg" alt="" loading="lazy" decoding="async" />
              </span>
            </span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <button class="toTop" id="toTop" type="button" data-i18n-title="toTop" data-i18n-aria="toTop" title="回到顶部" aria-label="回到顶部">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script defer src="/trtools/js/i18n-es.js"></script>
  <script defer src="/trtools/js/i18n.js"></script>
  <script defer src="/trtools/js/sidebar-shared.js"></script>

  <script defer src="/trtools/js/tool-registry.js"></script>
  <script defer src="/trtools/js/hot-switch.js"></script>
  <script defer src="/trtools/js/app-shell.js"></script>
  <script defer src="/trtools/js/online_client.js"></script>
  <script defer src="/trtools/js/visit-track.js"></script>
  <script defer src="/trtools/js/texturesplitter.js"></script>
  <script>
    (function () {
      var toTop = document.getElementById("toTop");
      if (!toTop) return;
      window.addEventListener(
        "scroll",
        function () {
          toTop.style.display = window.scrollY > 500 ? "flex" : "none";
        },
        { passive: true }
      );
      toTop.addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    })();
  </script>
</body>
</html>
