spring.application.name=tModLoaderTools
# 反代（Nginx）后 redirect:/ 等能生成正确的 https 与 Host，避免 Location 指向 127.0.0.1:8080
server.forward-headers-strategy=framework
# 经 Cloudflare 时，真实访客 IP 在 CF-Connecting-IP；请在源站 Nginx 透传，否则在线人数/统计仍会落到 CF 节点 IP。示例：
# proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;

# 上传 .tmod 文件（可能较大）
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB


# 特效编辑生成器（tEffectEditor）：独立项目目录，部署时与 jar 同级放置（目录名 tEffectEditor）。
# 可用此项覆盖为绝对路径（开发联调时指向本地编辑器目录）。留空则按候选目录自动探测。
trtools.effecteditor.dir=
